<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masuk — BERNADA.ID</title>
    <meta name="description" content="Masuk ke akun BERNADA.ID untuk membuat dan mengelola undangan digital Anda.">
    <link rel="icon" type="image/svg+xml" href="../assets/img/favicon.svg">
    <link rel="stylesheet" href="../assets/css/main.css">
</head>
<body class="auth-page">

    <main class="auth-card" aria-labelledby="auth-title">
        <div class="auth-brand">
            <span class="auth-brand-mark" aria-hidden="true">B</span>
            <span class="brand-text">BERNADA<em>.ID</em></span>
        </div>

        <h1 id="auth-title" class="auth-title">Selamat Datang</h1>
        <p id="auth-subtitle" class="auth-subtitle">Masuk untuk melanjutkan ke dasbor undangan Anda.</p>

        <div class="auth-tabs" id="auth-tabs" role="tablist" aria-label="Pilihan masuk atau daftar">
            <button id="tab-login" class="auth-tab is-active" type="button" role="tab"
                    aria-selected="true" aria-controls="login-form">Masuk</button>
            <button id="tab-register" class="auth-tab" type="button" role="tab"
                    aria-selected="false" aria-controls="register-form">Daftar</button>
        </div>

        <div id="auth-alert" class="auth-alert auth-alert-danger d-none" role="alert" aria-live="polite"></div>

        <!-- Form masuk -->
        <form id="login-form" class="auth-form" role="tabpanel" aria-labelledby="tab-login" novalidate>
            <div class="form-group">
                <label class="form-label" for="login-email">Email</label>
                <input class="input" id="login-email" name="email" type="email"
                       autocomplete="email" placeholder="nama@contoh.com" required>
            </div>
            <div class="form-group">
                <label class="form-label" for="login-password">Password</label>
                <input class="input" id="login-password" name="password" type="password"
                       autocomplete="current-password" placeholder="Minimal 8 karakter" required minlength="8">
            </div>
            <button class="btn btn-primary w-100" type="submit">Masuk</button>
            <p class="auth-helper">
                <button id="show-forgot" class="link-btn" type="button">Lupa password?</button>
            </p>
        </form>

        <!-- Form daftar -->
        <form id="register-form" class="auth-form d-none" novalidate>
            <div class="form-group">
                <label class="form-label" for="register-name">Nama Lengkap</label>
                <input class="input" id="register-name" name="fullName" type="text"
                       autocomplete="name" placeholder="Nama Anda" required maxlength="100">
            </div>
            <div class="form-group">
                <label class="form-label" for="register-email">Email</label>
                <input class="input" id="register-email" name="email" type="email"
                       autocomplete="email" placeholder="nama@contoh.com" required>
            </div>
            <div class="form-group">
                <label class="form-label" for="register-password">Password</label>
                <input class="input" id="register-password" name="password" type="password"
                       autocomplete="new-password" placeholder="Minimal 8 karakter" required minlength="8">
            </div>
            <button class="btn btn-primary w-100" type="submit">Buat Akun</button>
        </form>

        <!-- Form lupa password -->
        <form id="forgot-form" class="auth-form d-none" novalidate>
            <div class="form-group">
                <label class="form-label" for="forgot-email">Email</label>
                <input class="input" id="forgot-email" name="email" type="email"
                       autocomplete="email" placeholder="nama@contoh.com" required>
            </div>
            <button class="btn btn-primary w-100" type="submit">Kirim Tautan Reset</button>
            <p class="auth-helper">
                <button id="back-login-from-forgot" class="link-btn" type="button">← Kembali ke masuk</button>
            </p>
        </form>

        <!-- Form reset password -->
        <form id="reset-form" class="auth-form d-none" novalidate>
            <div class="form-group">
                <label class="form-label" for="reset-password">Password Baru</label>
                <input class="input" id="reset-password" name="password" type="password"
                       autocomplete="new-password" placeholder="Minimal 8 karakter" required minlength="8">
            </div>
            <div class="form-group">
                <label class="form-label" for="reset-password-confirm">Ulangi Password Baru</label>
                <input class="input" id="reset-password-confirm" name="passwordConfirm" type="password"
                       autocomplete="new-password" placeholder="Ulangi password baru" required>
            </div>
            <button class="btn btn-primary w-100" type="submit">Simpan Password Baru</button>
            <p class="auth-helper">
                <button id="back-login-from-reset" class="link-btn" type="button">← Kembali ke masuk</button>
            </p>
        </form>

        <p class="auth-footer">
            <a href="/">← Kembali ke beranda</a>
        </p>
    </main>

    <script type="module" src="../assets/js/login.js"></script>
</body>
</html>
